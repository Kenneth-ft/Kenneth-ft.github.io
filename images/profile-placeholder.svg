<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="240" height="240" rx="120" fill="url(#bgGrad)" stroke="#30363d" stroke-width="3" />
  
  <!-- Subtle Circuit Grid Accents -->
  <path d="M40 120 h40 M160 120 h40 M120 40 v40 M120 160 v40" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="80" cy="120" r="3" fill="#58a6ff" />
  <circle cx="160" cy="120" r="3" fill="#58a6ff" />
  <circle cx="120" cy="80" r="3" fill="#58a6ff" />
  <circle cx="120" cy="160" r="3" fill="#58a6ff" />

  <!-- Avatar Head & Shoulders Silhouette -->
  <g fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round">
    <!-- Head -->
    <circle cx="120" cy="95" r="36" fill="#1f242c" />
    <!-- Glasses / Tech detail -->
    <path d="M104 92 h12 M124 92 h12" stroke="#58a6ff" stroke-width="2.5" />
    <!-- Shoulders -->
    <path d="M64 185 c0 -32 25 -52 56 -52 s56 20 56 52" fill="#1f242c" />
  </g>

  <!-- Initials Badge -->
  <rect x="85" y="195" width="70" height="24" rx="12" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5" />
  <text x="120" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#79c0ff" text-anchor="middle" letter-spacing="1.5">KT // SFU</text>
</svg>

